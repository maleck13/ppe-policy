#
# NAIVE straight-translate of the Kuadrant AuthPolicy (opa-alias-method) into
# PPE. The Rego attribute references are copied VERBATIM; only the v0->v1 syntax
# is adjusted (that migration is out of scope for #130 — see the issue note).
#
#   Kuadrant Rego : req := input.context.request.http ; req.method == "POST"
#   here (PPE)    : req := input.context.request.http ; req.method == "POST"  (WRONG)
#
# Why this FAILS (issue #130, silent variant):
#   PPE's OPA `input` is the attribute bag nested (input.http.method,
#   input.subject.id, ...). `input.context` does not exist, so the binding
#   `req := input.context.request.http` resolves to UNDEFINED, `req.method` is
#   undefined, and `allow` never becomes true. OPA fails SILENTLY -> deny-all.
#   No error, no panic — the request is simply refused. This is the exact
#   silent-undefined failure #130 warns about, and here it is reached through an
#   indirected binding that string substitution could not have rewritten.
#
# Expected outcome: POST is denied (differential MISMATCH vs Authorino's 200).
#
# Run with:
#   ./run.sh opa-alias-method naive        # start
#   ./run.sh opa-alias-method naive -t     # validate only

engine_settings:
  dispatch: policy

global:
  pdp:
    - kind: opa
      modules:
        # Kuadrant Rego copied verbatim (attributes unmapped). input.context
        # does not exist in PPE -> req is undefined -> allow stays false.
        - |
          package authz
          default allow := false
          req := input.context.request.http
          allow if req.method == "POST"
  authorization:
    pre_invocation:
      - opa:
          query: data.authz.allow
