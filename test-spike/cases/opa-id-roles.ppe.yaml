#
# Correctly-mapped PPE equivalent of the toystore AuthPolicy
# (opa-id-roles.authpolicy.yaml). OPA counterpart of cel-id-roles. Two mappings:
#
#   1. Authentication: Authorino `authentication.jwt` becomes an `identity/jwt`
#      PLUGIN that fetches the same JWKS and maps claims into the PPE identity
#      bag via the `standard` preset (roles -> subject.roles).
#   2. Authorization attribute (the Rego input root moves):
#        Kuadrant Rego : input.auth.identity.roles[_] == "admin"
#        PPE Rego      : input.subject.roles[_]       == "admin"
#      Authorino's OPA input is the AuthJSON (identity at input.auth.identity);
#      PPE's OPA input is the attribute bag nested (input.subject.roles). This
#      relocation is the identity half of issue #130 for the OPA evaluator.
#
# JWKS URL differs from Authorino's by vantage point only (see cel-id-roles.ppe.yaml):
# PPE fetches over loopback via kubectl port-forward; iss/aud are a plain string
# match decoupled from the fetch URL.
#
# Expected: admin token -> 200 (allow), guest token -> 403 (deny). Matches Authorino.
#
# Run with:
#   ./run.sh opa-id-roles            # start (needs the mock port-forward, see SETUP.md)
#   ./run.sh opa-id-roles -t         # validate only

engine_settings:
  dispatch: policy

plugins:
  - name: mock-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    capabilities:
      # JWKS fetch is an outbound call; the plugin borrows the host transport,
      # gated by this grant.
      - perform_http
    config:
      role: user
      header: Authorization
      trusted_issuers:
        - issuer: "http://mock-jwt.toystore.svc.cluster.local:8088"
          audiences: ["toystore"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://127.0.0.1:8088/jwks"
            insecure_http: true   # loopback via port-forward — never production
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - mock-jwt
  pdp:
    - kind: opa
      modules:
        # Kuadrant Rego: input.auth.identity.roles[_] == "admin"
        # PPE Rego:      input.subject.roles[_]       == "admin"
        - |
          package authz
          default allow := false
          allow if input.subject.roles[_] == "admin"
  authorization:
    pre_invocation:
      - opa:
          query: data.authz.allow
