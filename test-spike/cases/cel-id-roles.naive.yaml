#
# NAIVE straight-translate of the Kuadrant AuthPolicy (cel-id-roles) into PPE.
#
# Authentication is wired the SAME as the mapped case (identity/jwt plugin), so
# the identity IS resolved into the PPE bag. What is copied VERBATIM is the
# AUTHORIZATION attribute reference:
#
#   Kuadrant CEL : auth.identity.roles.exists(r, r == 'admin')   (WKA)
#   here (PPE)   : auth.identity.roles.exists(r, r == 'admin')   (copied -- WRONG)
#
# Why this is expected to FAIL (see #130):
#   PPE has no `auth` namespace. Resolved identity lives in the `subject` bag
#   (subject.roles), not under `auth.identity`. The `auth` root does not resolve,
#   so PPE CEL fails closed -> deny, even for the admin token that Authorino
#   allows (200). That divergence on the ALLOW row is the #130 evidence for the
#   identity dictionary; the method cases can only show it on deny rows.
#
# Expected outcome: admin token is NOT allowed the way Authorino allows it (200)
#   -- a differential MISMATCH against the ground-truth gateway.
#
# Run with:
#   ./run.sh cel-id-roles naive        # start
#   ./run.sh cel-id-roles naive -t     # validate only

engine_settings:
  dispatch: policy

plugins:
  - name: mock-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    capabilities:
      - perform_http
    config:
      role: user
      header: Authorization
      trusted_issuers:
        - issuer: "http://mock-jwt.toystore.svc.cluster.local:8088"
          audiences: ["toystore"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://127.0.0.1:8088/jwks"
            insecure_http: true   # loopback via port-forward — never production
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - mock-jwt
  authorization:
    pre_invocation:
      # Kuadrant WKA copied verbatim -- `auth` is not a PPE namespace, so this
      # fails closed (deny) even for the admin token.
      - cel:
          expr: "auth.identity.roles.exists(r, r == 'admin')"
  pdp:
    - kind: cel
