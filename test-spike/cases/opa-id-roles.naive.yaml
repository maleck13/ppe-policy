#
# NAIVE straight-translate of the Kuadrant AuthPolicy (opa-id-roles) into PPE.
#
# Authentication is wired the SAME as the mapped case (identity/jwt plugin), so
# the identity IS resolved into the PPE bag. What is copied VERBATIM is the
# AUTHORIZATION attribute reference (only v0->v1 syntax is adjusted, which is out
# of scope for #130):
#
#   Kuadrant Rego : input.auth.identity.roles[_] == "admin"   (AuthJSON)
#   here (PPE)    : input.auth.identity.roles[_] == "admin"   (copied -- WRONG)
#
# Why this FAILS (issue #130, silent variant):
#   PPE's OPA `input` is the attribute bag nested; the resolved identity lives at
#   input.subject.roles, not input.auth.identity. `input.auth` does not exist, so
#   the reference is UNDEFINED, `allow` never becomes true, and the request is
#   denied SILENTLY -- including the admin token that Authorino allows (200).
#   Contrast cel-id-roles.naive, where the same mistake fails LOUD (CEL errors on
#   the undeclared `auth` root). That CEL-loud / OPA-silent split is the identity
#   echo of the request-attribute finding (cel-req-method vs opa-alias-method).
#
# Expected outcome: admin token is NOT allowed the way Authorino allows it (200)
#   -- a differential MISMATCH against the ground-truth gateway, on the allow row.
#
# Run with:
#   ./run.sh opa-id-roles naive        # start
#   ./run.sh opa-id-roles naive -t     # validate only

engine_settings:
  dispatch: policy

plugins:
  - name: mock-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    capabilities:
      - perform_http
    config:
      role: user
      header: Authorization
      trusted_issuers:
        - issuer: "http://mock-jwt.toystore.svc.cluster.local:8088"
          audiences: ["toystore"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://127.0.0.1:8088/jwks"
            insecure_http: true   # loopback via port-forward — never production
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - mock-jwt
  pdp:
    - kind: opa
      modules:
        # Kuadrant Rego copied verbatim -- input.auth does not exist in PPE, so
        # this is undefined and allow stays false (silent deny-all).
        - |
          package authz
          default allow := false
          allow if input.auth.identity.roles[_] == "admin"
  authorization:
    pre_invocation:
      - opa:
          query: data.authz.allow
