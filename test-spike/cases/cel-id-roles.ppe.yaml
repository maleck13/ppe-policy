#
# Correctly-mapped PPE equivalent of the toystore AuthPolicy
# (cel-id-roles.authpolicy.yaml). Two mappings under test here:
#
#   1. Authentication: Authorino `authentication.jwt` (issuer + jwksUrl) becomes
#      an `identity/jwt` PLUGIN that fetches the same JWKS and maps claims into
#      the PPE identity bag via the `standard` preset (roles -> subject.roles).
#   2. Authorization attribute: the identity claim reference is remapped
#        Kuadrant CEL : auth.identity.roles.exists(r, r == 'admin')
#        PPE CEL      : subject.roles.exists(r, r == 'admin')
#      This `auth.identity.* -> subject.*` move is non-mechanical (it goes
#      through the claim mapper), which is the identity half of issue #130.
#
# JWKS URL differs from Authorino's by vantage point only: Authorino (in-cluster)
# uses the service DNS name; PPE runs locally and reaches the same pod through
# `kubectl port-forward` on loopback. A literal loopback address bypasses the
# host's private-IP guard (praxis-proxy-core peer.rs), so `insecure_http: true`
# (plaintext scheme) plus the host's `allow_private_endpoints` is all it needs.
# `iss`/`aud` are a plain string match on both sides, so the service-DNS issuer
# in the token matches this config regardless of the loopback fetch URL.
#
# Expected: admin token -> 200 (allow), guest token -> 403 (deny). Matches Authorino.
#
# Run with:
#   ./run.sh cel-id-roles            # start (needs the mock port-forward, see SETUP.md)
#   ./run.sh cel-id-roles -t         # validate only

engine_settings:
  dispatch: policy

plugins:
  - name: mock-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    capabilities:
      # JWKS fetch is an outbound call; the plugin borrows the host transport,
      # gated by this grant.
      - perform_http
    config:
      role: user
      header: Authorization
      trusted_issuers:
        - issuer: "http://mock-jwt.toystore.svc.cluster.local:8088"
          audiences: ["toystore"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://127.0.0.1:8088/jwks"
            insecure_http: true   # loopback via port-forward — never production
          leeway_seconds: 60
      claim_mapper: standard

global:
  authentication:
    - mock-jwt
  authorization:
    pre_invocation:
      # Kuadrant CEL: auth.identity.roles.exists(r, r == 'admin')
      # PPE CEL:      subject.roles.exists(r, r == 'admin')
      - cel:
          expr: "subject.roles.exists(r, r == 'admin')"
  pdp:
    - kind: cel
