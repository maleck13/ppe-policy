#
# NAIVE straight-translate of the Kuadrant AuthPolicy (cel-req-method) into PPE.
#
# This is the "lift-and-shift" case from issue #130: the Kuadrant CEL predicate
# is copied VERBATIM into PPE config, without mapping the attribute dictionary.
#
#   Kuadrant CEL : request.method == 'POST'   (WKA: HTTP method)
#   here (PPE)   : request.method == 'POST'   (copied verbatim -- WRONG)
#
# Why this is expected to FAIL (see #130):
#   PPE's `request.*` bag is environment/trace metadata (request.request_id,
#   request.timestamp, request.trace_id, ...), NOT the HTTP request. The HTTP
#   method lives at `http.method` (see policy-test.yaml for the correct map).
#   `request.method` therefore does not resolve in PPE. Per #130, CEL surfaces
#   this as an acute error (up to a panic), unlike OPA which fails silently.
#
# Expected outcome: POST does NOT get allowed the way Authorino allows it
#   (200) -- i.e. a differential MISMATCH against the ground-truth gateway.
#   The exact PPE behaviour (deny / eval error / validation reject) is what the
#   run records; this file exists to observe and document that failure, which is
#   the evidence motivating the #130 compatibility shim / transpiler.
#
# Run with:
#   ./run.sh cel-req-method naive        # start
#   ./run.sh cel-req-method naive -t     # validate only

engine_settings:
  dispatch: policy

global:
  authorization:
    pre_invocation:
      # Kuadrant WKA copied verbatim -- unmapped, does not resolve in PPE.
      - cel:
          expr: "request.method == 'POST'"
  pdp:
    - kind: cel
