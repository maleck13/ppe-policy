# Test: OPA-DEP-01 — deprecated context.* path (OPA rego)
# Attribute: input.context.request.http.method (deprecated GJSON/OPA-only path)
# Rego: allow { input.context.request.http.method == "POST" }
# Expected (Authorino): POST -> 200, GET/DELETE -> 403
# Note: Authorino OPA supports context.*; Authorino CEL does NOT.
#       Grouped under "dep" because it exercises the deprecated context.* path,
#       not the canonical input.request.method path (that would be opa-req-method).
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: opa-dep-method
  namespace: toystore
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: toystore
  defaults:
    rules:
      authorization:
        only-post-opa:
          opa:
            rego: |
              allow { input.context.request.http.method == "POST" }
