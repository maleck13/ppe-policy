# Test: CEL-ID-01/02 — identity roles claim (JWT authn + CEL authorization)
# Attribute: auth.identity.roles  (Kuadrant WKA -> PPE subject.roles)
# Predicate: token carries role "admin"
# Varies the IDENTITY (token), not the method: same GET /toys with a
# Bearer token whose `roles` claim is ["admin"] (allow) or ["guest"] (deny).
# Tokens are minted by the in-cluster mock (testbed/40-mock-jwt.yaml); see the
# companion cel-id-roles.tokens file for the per-key claim sets.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: cel-id-roles
  namespace: toystore
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: toystore
  defaults:
    rules:
      authentication:
        mock-jwt:
          jwt:
            issuer: "http://mock-jwt.toystore.svc.cluster.local:8088"
            jwksUrl: "http://mock-jwt.toystore.svc.cluster.local:8088/jwks"
            audiences:
              - toystore
      authorization:
        require-admin-role:
          patternMatching:
            patterns:
              - predicate: "auth.identity.roles.exists(r, r == 'admin')"
