#
# Local PPE policy document for the attribute-mapping test spike.
#
# Purpose: hand-written equivalent of the toystore AuthPolicy
#   (test-spike/cel-req-method.authpolicy.yaml), so we can diff PPE's
#   admission decision against Authorino's for the same request.
#
# Kuadrant -> PPE attribute mapping under test:
#   request.method  ->  http.method      (see docs/brainstorms/.../attribute-mapping.md, sec 1)
#
# This is authorization-ONLY: no `authentication:` list and no plugins.
# It mirrors the toystore AuthPolicy, which has no auth rule -- purely a
# method predicate. `authentication` is Option<..> in PPE config, so a
# global block without it is valid (crates/ppe-core/src/config.rs:237).
#
# Expected (pure L7 admission, no MCP/body):
#   POST /*   -> forwarded to echo backend (HTTP 200)
#   GET/*     -> engine authz deny        (HTTP 403)

engine_settings:
  dispatch: policy

global:
  authorization:
    pre_invocation:
      # Kuadrant CEL: request.method == 'POST'
      # PPE CEL:      http.method  == 'POST'
      - cel:
          expr: "http.method == 'POST'"
  pdp:
    - kind: cel
