# Praxis listener for the attribute-mapping test spike (pure L7 admission).
# Chain: policy -> router -> load_balancer. Driven by run.sh / suite.sh, which
# overwrite ./policy-active.yaml (ephemeral, gitignored) with the selected case's
# policy from cases/<stem>.{ppe,naive}.yaml before launch. See SETUP.md.

listeners:
  - name: gateway
    address: "127.0.0.1:8095"
    protocol: http
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: policy
        config_path: ./policy-active.yaml
        # Lets identity cases fetch the mock JWKS over loopback. The policy
        # filter's own outbound transport gates this separately from
        # insecure_options.allow_private_endpoints below. Loopback only.
        allow_private_idp: true

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: echo-backend

      - filter: load_balancer
        clusters:
          - name: echo-backend
            endpoints:
              - "127.0.0.1:9200"

# Allows the loopback httpbin upstream. Covers the proxy upstream only; the
# policy filter's JWKS transport uses allow_private_idp above.
insecure_options:
  allow_private_endpoints: true
