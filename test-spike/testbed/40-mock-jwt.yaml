# Mock OIDC token minter for the identity dimension of the spike (issue #133).
#
# TEST-ONLY. jvanderhoof/mock-jwt-server: RS256, serves a JWKS at /jwks and
# mints tokens on POST /generate (JSON body = extra claims). It does NOT serve
# OIDC discovery, so both gateways wire the JWKS URL directly.
#
# Two vantage points fetch this server's JWKS:
#   * Authorino (in-cluster) -> http://mock-jwt.toystore.svc.cluster.local:8088/jwks
#   * PPE (local process)    -> http://127.0.0.1:8088/jwks (via kubectl port-forward)
# The keypair is generated per boot, so ONE instance must serve both; suite.sh
# mints each token once and fires it at both sides.
#
# `iss` and `aud` come from env below and are a plain string match on each side
# (decoupled from the JWKS URL), so any constant works as long as both gateway
# configs agree with it. We use the in-cluster service name as the issuer.
#
# Image pinned by digest for reproducibility.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-jwt
  namespace: toystore
  labels:
    app: mock-jwt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-jwt
  template:
    metadata:
      labels:
        app: mock-jwt
    spec:
      containers:
        - name: mock-jwt
          image: jvanderhoof/mock-jwt-server@sha256:60d340f52b612a69a6345642e488d24bbb1c09c0b3956f7b02896438484c6430
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: ISSUER
              value: "http://mock-jwt.toystore.svc.cluster.local:8088"
            - name: AUDIENCE
              value: "toystore"
            - name: SUBJECT
              value: "mock-user"
          readinessProbe:
            httpGet:
              path: /jwks
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-jwt
  namespace: toystore
  labels:
    app: mock-jwt
spec:
  selector:
    app: mock-jwt
  ports:
    - name: http
      port: 8088
      targetPort: 8088
